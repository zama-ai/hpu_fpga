# =====================================================================================================================
[section.mhdma_request]
description="Request registers interface"
offset= 0x100

[section.mhdma_request.register.req_id]
  description="Different parameters for qsfp lines"
  owner="User"
  read_access="Read"
  write_access="WriteNotify"
  field.size_b  = {size_b=16, offset_b=0,  default={Cst=0x4000}, description="size request in bytes, default is ct size"}
  field.node_id = {size_b=4,  offset_b=16, default={Cst=0x0},    description="node id or HPU target id"}
  field.req_id  = {size_b=4,  offset_b=20, default={Cst=0x0},    description="request identifier"}
  field.iop_id  = {size_b=8,  offset_b=24, default={Cst=0x0},    description="IOP id from software point of view"}

[section.mhdma_request.register.req_addr]
  description="request address"
  owner="User"
  read_access="Read"
  write_access="WriteNotify"
  field.src = {size_b=16, offset_b=0,  default={Cst=0x0}, description="ciphertext source address"}
  field.dst = {size_b=16, offset_b=16, default={Cst=0x0}, description="ciphertext destination address"}

[section.mhdma_request.register.notify]
  description="When a notify is received, this register will be updated"
  owner="Kernel"
  read_access="ReadNotify"
  write_access="None"
  field.iop_id    = {size_b=4,  offset_b=0,  default={Cst=0x0}, description="what is the IOP ID of received Notify"}
  field.node_id   = {size_b=4,  offset_b=4,  default={Cst=0x0}, description="what HPU is the source of this Notify"}
  field.src_addr  = {size_b=16, offset_b=16, default={Cst=0x0}, description="what is the source address of the ct notified"}

[section.mhdma_request.register.read_request]
  description="When a read request has bneen processed, this register will be updated"
  owner="Kernel"
  read_access="ReadNotify"
  write_access="None"
  field.iop_id    = {size_b=4,  offset_b=0,  default={Cst=0x0}, description="what is the IOP ID of received ct"}
  field.node_id   = {size_b=4,  offset_b=4,  default={Cst=0x0}, description="from what HPU has been retreived this ct"}
  field.dst_addr  = {size_b=16, offset_b=16, default={Cst=0x0}, description="where is the ct"}

[section.mhdma_request.register.stat_notify]
  description="requests statistics each counter is up to 40seconds"
  owner="Kernel"
  read_access="ReadNotify"
  write_access="None"
  field.cnt_read    = {size_b=16, offset_b=16, default={Cst=0x0}, description="number of notify that have been sent"}

[section.mhdma_request.register.stat_notify_ack]
  description="requests statistics each counter is up to 40seconds"
  owner="Kernel"
  read_access="ReadNotify"
  write_access="None"
  field.cnt_ack     = {size_b=16, offset_b=0,  default={Cst=0x0}, description="number of notify ack that have been received"}

[section.mhdma_request.register.stat_notify_timeout]
  description="requests statistics each counter is up to 40seconds"
  owner="Kernel"
  read_access="ReadNotify"
  write_access="None"
  field.cnt_timeout = {size_b=16, offset_b=16, default={Cst=0x0}, description="timeout counter on notify"}

[section.mhdma_request.register.stat_notify_timeout_retry]
  description="requests statistics each counter is up to 40seconds"
  owner="Kernel"
  read_access="ReadNotify"
  write_access="None"
  field.cnt_retry   = {size_b=16, offset_b=16, default={Cst=0x0}, description="counter of number of retries that have been done"}

# =====================================================================================================================
[section.mhdma_lane]
offset= 0x200
description="Line parameter sections"

[section.mhdma_lane.register.debug]
  description="Different parameters for debugging qsfp lines"
  owner="User"
  read_access="Read"
  write_access="Write"
  field.rx_to_tx        = {size_b=1, offset_b=29, default={Cst=0x0}, description="a"}
  field.tx_loop         = {size_b=1, offset_b=30, default={Cst=0x0}, description="b"}
  field.reset_registers = {size_b=1, offset_b=31, default={Cst=0x0}, description="c"}

