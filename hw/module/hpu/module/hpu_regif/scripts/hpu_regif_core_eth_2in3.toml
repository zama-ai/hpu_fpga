  write_access="Write"
  default={Cst=0x0}

[section.mhdma_hpu_id.register.four]
  description="HPU ID four"
  owner="User"
  read_access="Read"
  write_access="Write"
  default={Cst=0x0}

[section.mhdma_hpu_id.register.five]
  description="HPU ID five"
